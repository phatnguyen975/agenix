extend schema @contact(name: "API Support", url: "https://example.com/support")

"""Applied to the schema itself."""
directive @contact(
  """Human-readable API support contact name."""
  name: String!
  """URL for the API support contact or documentation."""
  url: String
) on SCHEMA

"""Repeatable directive: may be applied several times to one element."""
directive @tag(
  """Tag value used for classification and filtering."""
  name: String!
) repeatable on OBJECT | FIELD_DEFINITION | INTERFACE | UNION | ARGUMENT_DEFINITION | INPUT_OBJECT | INPUT_FIELD_DEFINITION | ENUM | ENUM_VALUE | SCALAR

"""An entity with a stable identifier and update timestamp."""
interface Auditable implements Node {
  """Stable global identifier."""
  id: ID!
  """Time of the most recent update."""
  updatedAt: DateTime!
}

"""An invoice associated with an order."""
type Invoice implements Auditable & Node @tag(name: "billing") @tag(name: "finance") {
  """Stable global identifier."""
  id: ID!
  """Time of the most recent update."""
  updatedAt: DateTime!
  """Invoice lines, with a bounded page size."""
  lines(
    """Maximum lines to return; defaults to 20 and must not exceed 100."""
    first: Int = 20
    """Cursor from the previous page."""
    after: String
    """Deprecated filter; void lines are no longer returned."""
    includeVoid: Boolean = false @deprecated(reason: "Void lines are no longer returned.")
  ): [OrderLine!]!
}

"""Filters for invoice listings."""
input InvoiceFilter {
  """Include invoices with one of these order states."""
  status: [OrderStatus!]
  """Deprecated input field."""
  olderThan: DateTime @deprecated(reason: "Use createdBefore.")
  """Include invoices created before this instant."""
  createdBefore: DateTime
  """Maximum number of invoices to return; defaults to 20 and must not exceed 100."""
  limit: Int = 20
}

# Extensions of existing definitions.
extend type Order {
  """Invoice associated with this order, when one exists."""
  invoice: Invoice
}
extend enum OrderStatus {
  """Payment was refunded."""
  REFUNDED
}
extend union SearchResult = Invoice
extend input OrderFilter {
  """Include orders whose total is at least this amount in minor units."""
  minimumTotal: MinorUnits
}
"""An entity with a human-readable label."""
interface Labeled {
  """Display label for the entity."""
  label: String
}
extend interface Labeled {
  """Adding a field to an interface requires every implementing type to provide it."""
  shortLabel: String
}
extend scalar URL @tag(name: "web")


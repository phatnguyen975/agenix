# TEMPLATE: extensions cannot carry descriptions; a `schema { ... }` definition can.
extend schema @contact(name: "API Support", url: "https://example.com/support")

"""Applied to the schema itself."""
directive @contact(name: String!, url: String) on SCHEMA

"""Repeatable directive: may be applied several times to one element."""
directive @tag(name: String!) repeatable on OBJECT | FIELD_DEFINITION | INTERFACE | UNION | ARGUMENT_DEFINITION | INPUT_OBJECT | INPUT_FIELD_DEFINITION | ENUM | ENUM_VALUE | SCALAR

"""Interface that implements another interface."""
interface Auditable implements Node {
  id: ID!
  updatedAt: DateTime!
}

type Invoice implements Auditable & Node @tag(name: "billing") @tag(name: "finance") {
  id: ID!
  updatedAt: DateTime!
  """Deprecated argument and defaults."""
  lines(first: Int = 20, after: String, includeVoid: Boolean = false @deprecated(reason: "Void lines are no longer returned.")): [OrderLine!]!
}

input InvoiceFilter {
  status: [OrderStatus!]
  """Deprecated input field."""
  olderThan: DateTime @deprecated(reason: "Use createdBefore.")
  createdBefore: DateTime
  limit: Int = 20
}

# Extensions of existing definitions.
extend type Order {
  invoice: Invoice
}
extend enum OrderStatus {
  REFUNDED
}
extend union SearchResult = Invoice
extend input OrderFilter {
  minimumTotal: Int
}
interface Labeled {
  label: String
}
extend interface Labeled {
  """Adding a field to an interface requires every implementing type to provide it."""
  shortLabel: String
}
extend scalar URL @tag(name: "web")

